<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>稿单 - 妖画集</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Nunito Sans & Noto Sans SC -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- BEGIN: Custom Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              primary: '#3c6a58',
              'primary-hover': '#325748',
              'primary-light': '#e9f1ed',
              'surface': '#fcfdfa',
              'surface-card': '#ffffff',
              'tag-gray': '#eef0ed',
              'text-dark': '#2c3631',
              'text-subtle': '#87928d',
              'text-muted': '#c1c9c4',
              'badge-cyan': '#45817c',
              'badge-brown': '#aa7b49',
              'badge-blue': '#4c7c9b',
              'badge-green': '#517f59',
              'dot-order': '#3f826d',
              'dot-deadline': '#dc6e64',
            }
          },
          fontFamily: {
            sans: ['"Nunito Sans"', '"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          borderRadius: {
            'custom-card': '14px',
            'custom-pill': '9999px',
          }
        }
      }
    }
  </script>
<!-- END: Custom Tailwind Configuration -->
<!-- BEGIN: Dot Grid Paper Background Style -->
<style data-purpose="stationery-paper-background">
    body {
      background-color: #fafcf8;
      background-image: radial-gradient(#d3dbd1 1.25px, transparent 1.25px);
      background-size: 20px 20px;
      font-family: 'Nunito Sans', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<!-- END: Dot Grid Paper Background Style -->
</head>
<body class="min-h-screen text-theme-text-dark flex flex-col justify-between selection:bg-theme-primary selection:text-white pb-28" style="background-color: rgb(247, 250, 245); background-image: radial-gradient(rgb(211, 219, 209) 1.2px, transparent 1.2px); background-size: 20px 20px;">
<!-- BEGIN: Status and Top Navigation Bar -->
<header class="w-full pt-1.5 px-5 select-none bg-transparent">
<!-- Android Top Status Bar Simulation -->

<!-- Center Title: 稿单 with Clip Board Icon -->
<div class="flex items-center justify-center pt-3 pb-2 text-[#303d36]">
<div class="flex items-center space-x-1.5 text-lg font-bold">
<!-- Cute Stationery Clipboard Icon -->
<span class="text-xl">📋</span>
<span class="tracking-wide text-[19px]">稿单</span>
</div>
</div>
</header>
<!-- END: Status and Top Navigation Bar -->
<!-- BEGIN: Main Page Content -->
<main class="w-full px-4 max-w-md mx-auto space-y-4">
<!-- BEGIN: Calendar Module -->
<section class="w-full pt-1" data-purpose="schedule-calendar">
<!-- Calendar Header: Month Picker and Prev/Next Arrows -->
<div class="flex items-center justify-between px-2 mb-4">
<!-- Prev Month Button -->
<button aria-label="上个月" class="w-8 h-8 rounded-full bg-[#e3ebe5] flex items-center justify-center text-[#4b5b52] hover:bg-[#d6e2d9] transition-colors" type="button">
<svg class="w-4 h-4 -translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Current Month Capsule Label -->
<div class="bg-[#e4ede6] px-4 py-1.5 rounded-full flex items-center space-x-1.5 text-[#304138] font-bold text-base shadow-sm">
<span class="">2026年 9月</span>
<svg class="w-3.5 h-3.5 text-[#516359] fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</div>
<!-- Next Month Button -->
<button aria-label="下个月" class="w-8 h-8 rounded-full bg-[#e3ebe5] flex items-center justify-center text-[#4b5b52] hover:bg-[#d6e2d9] transition-colors" type="button">
<svg class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Calendar Weekday Names Grid -->
<div class="grid grid-cols-7 text-center text-xs font-semibold text-[#5a7b6b] mb-2">
<div class="">日</div>
<div class="">一</div>
<div class="">二</div>
<div class="">三</div>
<div class="">四</div>
<div class="">五</div>
<div class="">六</div>
</div>
<!-- Calendar Days Grid (7 Columns) -->
<div class="grid grid-cols-7 gap-y-3.5 text-center text-sm font-semibold text-[#33423a] items-center">
<!-- Prev month days (Greyed out) -->
<div class="text-[#c1ccc4] text-[15px]">30</div>
<div class="text-[#c1ccc4] text-[15px]">31</div>
<!-- Current month days -->
<div class="text-[15px]">1</div>
<div class="text-[15px]">2</div>
<div class="text-[15px]">3</div>
<div class="text-[15px]">4</div>
<div class="text-[15px]">5</div>
<div class="text-[15px]">6</div>
<div class="text-[15px]">7</div>
<div class="text-[15px]">8</div>
<div class="text-[15px]">9</div>
<div class="text-[15px]">10</div>
<div class="text-[15px]">11</div>
<div class="text-[15px]">12</div>
<div class="text-[15px]">13</div>
<div class="text-[15px]">14</div>
<div class="text-[15px]">15</div>
<div class="text-[15px]">16</div>
<div class="text-[15px]">17</div>
<div class="text-[15px]">18</div>
<div class="text-[15px]">19</div>
<div class="text-[15px]">20</div>
<div class="text-[15px]">21</div>
<div class="text-[15px]">22</div>
<div class="text-[15px]">23</div>
<div class="text-[15px]">24</div>
<div class="text-[15px]">25</div>
<!-- Highlighted Active Day 26 -->
<div class="flex justify-center items-center">
<div class="w-10 h-10 bg-theme-primary text-white rounded-[13px] flex items-center justify-center font-bold text-base shadow-sm">
            26
          </div>
</div>
<div class="text-[15px]">27</div>
<div class="text-[15px]">28</div>
<div class="text-[15px]">29</div>
<div class="text-[15px]">30</div>
<!-- Next month days (Greyed out) -->
<div class="text-[#cbd4cd] text-[15px]">1</div>
<div class="text-[#cbd4cd] text-[15px]">2</div>
<div class="text-[#cbd4cd] text-[15px]">3</div>
</div>
<!-- Calendar Legend Indicators (接稿日 / 截稿日) -->
<div class="flex items-center justify-center space-x-6 mt-4 text-xs font-medium text-[#4a5851]">
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-theme-dot-order"></span>
<span class="">接稿日</span>
</div>
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-theme-dot-deadline"></span>
<span class="">截稿日</span>
</div>
</div>
</section>
<!-- END: Calendar Module -->
<!-- BEGIN: Order Status Quick Statistics Cards -->
<section class="grid grid-cols-4 gap-2 pt-1.5" data-purpose="status-summary-cards">
<!-- 待接单 -->
<div class="bg-white rounded-xl py-2.5 px-2 flex flex-col items-center justify-center shadow-[0_1px_3px_rgba(0,0,0,0.03)] border border-[#eff3ee]">
<span class="text-xl font-bold text-[#355b4e] leading-tight">0</span>
<div class="flex items-center space-x-1 mt-1 text-[11px] text-[#4d5c55] font-medium">
<svg class="w-3 h-3 text-[#7b8a82]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span class="whitespace-nowrap">待接单</span>
</div>
</div>
<!-- 进行中 -->
<div class="bg-white rounded-xl py-2.5 px-2 flex flex-col items-center justify-center shadow-[0_1px_3px_rgba(0,0,0,0.03)] border border-[#eff3ee]">
<span class="text-xl font-bold text-[#b58145] leading-tight">0</span>
<div class="flex items-center space-x-1 mt-1 text-[11px] text-[#4d5c55] font-medium">
<svg class="w-3 h-3 text-[#7b8a82]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span class="whitespace-nowrap">进行中</span>
</div>
</div>
<!-- 待验收 -->
<div class="bg-white rounded-xl py-2.5 px-2 flex flex-col items-center justify-center shadow-[0_1px_3px_rgba(0,0,0,0.03)] border border-[#eff3ee]">
<span class="text-xl font-bold text-[#4c7c9b] leading-tight">0</span>
<div class="flex items-center space-x-1 mt-1 text-[11px] text-[#4d5c55] font-medium">
<svg class="w-3 h-3 text-[#7b8a82]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span class="whitespace-nowrap">待验收</span>
</div>
</div>
<!-- 已完成 -->
<div class="bg-white rounded-xl py-2.5 px-2 flex flex-col items-center justify-center shadow-[0_1px_3px_rgba(0,0,0,0.03)] border border-[#eff3ee]">
<span class="text-xl font-bold text-[#4d7f57] leading-tight">0</span>
<div class="flex items-center space-x-1 mt-1 text-[11px] text-[#4d5c55] font-medium">
<svg class="w-3 h-3 text-[#7b8a82]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span class="whitespace-nowrap">已完成</span>
</div>
</div>
</section>
<!-- END: Order Status Quick Statistics Cards -->
<!-- BEGIN: Search Bar -->
<section class="pt-0.5" data-purpose="search-box">
<div class="relative flex items-center">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8e9d96]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-white border border-[#d9e2db] rounded-xl text-xs placeholder-[#91a098] focus:outline-none focus:ring-1 focus:ring-theme-primary focus:border-theme-primary shadow-sm tracking-wide" placeholder="搜索客户、类型、状态、备注、日期..." type="text">
</div>
</section>
<!-- END: Search Bar -->
<!-- BEGIN: Filter Tags & Sorting -->
<section class="space-y-3" data-purpose="filters-and-sort">
<!-- Filter Chips Row -->
<div class="flex items-center space-x-2 overflow-x-auto pb-0.5 no-scrollbar">
<!-- Active Tag: 全部 -->
<button class="px-4 py-1.5 bg-[#426a5a] text-white text-xs font-semibold rounded-full shrink-0 shadow-sm">
          全部
        </button>
<!-- Inactive Tag: 待接单 -->
<button class="px-3.5 py-1.5 bg-white border border-[#dce3de] text-[#4d5c55] text-xs font-medium rounded-full shrink-0 shadow-xs">
          待接单
        </button>
<!-- Inactive Tag: 进行中 -->
<button class="px-3.5 py-1.5 bg-white border border-[#dce3de] text-[#4d5c55] text-xs font-medium rounded-full shrink-0 shadow-xs">
          进行中
        </button>
<!-- Inactive Tag: 待验收 -->
<button class="px-3.5 py-1.5 bg-white border border-[#dce3de] text-[#4d5c55] text-xs font-medium rounded-full shrink-0 shadow-xs">
          待验收
        </button>
<!-- Inactive Tag: 已完成 -->
<button class="px-3.5 py-1.5 bg-white border border-[#dce3de] text-[#4d5c55] text-xs font-medium rounded-full shrink-0 shadow-xs">
          已完成
        </button>
</div>
<!-- Sorting Selector -->
<div class="flex items-center space-x-2 text-xs text-[#5f6f67]">
<!-- Tag Label -->
<div class="flex items-center space-x-1 pl-0.5">
<svg class="w-3.5 h-3.5 text-[#6c7d74]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="font-medium">排序</span>
</div>
<!-- Dropdown Capsule -->
<div class="bg-white border border-[#dce3de] rounded-full px-3 py-1 flex items-center space-x-2 shadow-xs cursor-pointer">
<span class="text-[#3b4943] font-medium text-xs">按创建时间</span>
<svg class="w-3 h-3 text-[#798881] fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</section>
<!-- END: Filter Tags & Sorting -->
<!-- BEGIN: Empty List State -->
<section class="pt-1 px-1" data-purpose="list-content-empty-state">
<div class="text-xs font-medium text-[#798a81] tracking-wide">
        共 0 单稿件
      </div>
</section>
<!-- END: Empty List State -->
</main>
<!-- END: Main Page Content -->
<!-- BEGIN: Floating Action Button (FAB) -->
<aside class="fixed right-5 bottom-24 z-30">
<button aria-label="新建稿单" class="w-14 h-14 rounded-full bg-[#4e7968] hover:bg-[#436a5b] text-white flex items-center justify-center shadow-lg shadow-[#3c6a58]/35 transition-transform active:scale-95" type="button">
<svg class="w-7 h-7 stroke-[2.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</aside>
<!-- END: Floating Action Button (FAB) -->
<!-- BEGIN: Bottom Stationery Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-[#edf2ec] pt-2 pb-1.5 px-4">
  <div class="max-w-md mx-auto grid grid-cols-4 items-center gap-1">
    <!-- Tab 1: 首页 -->
    <a class="flex flex-col items-center justify-center py-1.5 px-1 text-[#717974] hover:text-[#3c6a58] transition-colors" href="#home">
      <span class="material-symbols-outlined text-[22px] leading-none">home</span>
      <span class="text-[11px] mt-1 font-medium">首页</span>
    </a>
    <!-- Tab 2: 稿单 (Active Capsule) -->
    <a class="flex flex-col items-center justify-center py-1.5 px-2 rounded-full bg-[#e1e9df] text-[#3c6a58] font-bold transition-all shadow-xs" href="#orders">
      <span class="material-symbols-outlined text-[22px] leading-none">assignment</span>
      <span class="text-[11px] mt-0.5 tracking-tight font-bold">稿单</span>
    </a>
    <!-- Tab 3: 画库 -->
    <a class="flex flex-col items-center justify-center py-1.5 px-1 text-[#717974] hover:text-[#3c6a58] transition-colors" href="#gallery">
      <span class="material-symbols-outlined text-[22px] leading-none">pets</span>
      <span class="text-[11px] mt-1 font-medium">画库</span>
    </a>
    <!-- Tab 4: 我的 -->
    <a class="flex flex-col items-center justify-center py-1.5 px-1 text-[#717974] hover:text-[#3c6a58] transition-colors" href="#profile">
      <span class="material-symbols-outlined text-[22px] leading-none">person</span>
      <span class="text-[11px] mt-1 font-medium">我的</span>
    </a>
  </div>
  <!-- Bottom Gesture Bar Safe Area Indicator -->
  <div class="w-full flex justify-center pt-2 pb-0.5">
    <div class="w-32 h-1 bg-[#2c3831] rounded-full opacity-80"></div>
  </div>
</nav>
<!-- END: Bottom Stationery Navigation Bar -->






</body></html>
