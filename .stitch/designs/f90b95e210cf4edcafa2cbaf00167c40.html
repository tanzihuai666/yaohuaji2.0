<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>妖画集 - 画库</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sage-dark': '#4F725F',
            'sage-hover': '#436151',
            'sage-light': '#E9F1EB',
            'sage-border': '#7FA68E',
            'paper-cream': '#FCFBF7',
            'charcoal-title': '#343834',
            'muted-sage': '#8D998F',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- Dotted stationery paper background -->
<style data-purpose="stationery-texture">
    body {
      background-color: #FAF9F3;
      background-image: radial-gradient(#D6DDD2 1px, transparent 1px);
      background-size: 18px 18px;
    }
  </style>
</head>
<body class="min-h-screen text-charcoal-title antialiased flex flex-col justify-between selection:bg-sage-light" style="background-color: rgb(247, 250, 245); background-image: radial-gradient(rgb(211, 219, 209) 1.2px, transparent 1.2px); background-size: 20px 20px;">
<!-- BEGIN: MainContainer -->
<div class="w-full max-w-md mx-auto flex-1 flex flex-col pb-28">
<!-- BEGIN: MobileStatusBar -->

<!-- END: MobileStatusBar -->
<!-- BEGIN: TopBarTitle -->
<div class="w-full py-2.5 flex items-center justify-center text-center relative" data-purpose="top-nav-title">
<div class="flex items-center space-x-1.5 text-base font-bold text-charcoal-title">
<!-- Cute Mascot Bear Head Icon -->
<svg class="w-5 h-5 text-muted-sage fill-none stroke-current stroke-[2]" viewBox="0 0 24 24">
<circle cx="12" cy="13" r="7"></circle>
<circle cx="6.5" cy="7.5" r="2.5"></circle>
<circle cx="17.5" cy="7.5" r="2.5"></circle>
<circle cx="10" cy="12" fill="currentColor" r="0.75"></circle>
<circle cx="14" cy="12" fill="currentColor" r="0.75"></circle>
<ellipse cx="12" cy="14.5" rx="1.5" ry="1"></ellipse>
</svg>
<span class="tracking-wide">画库</span>
</div>
</div>
<!-- END: TopBarTitle -->
<main class="px-5 pt-3 space-y-4">
<!-- BEGIN: GalleryHeaderSection -->
<section class="space-y-1" data-purpose="gallery-summary">
<div class="flex items-center space-x-2">
<!-- Mascot Icon -->
<svg class="w-6 h-6 text-charcoal-title fill-none stroke-current stroke-[2]" viewBox="0 0 24 24">
<circle cx="12" cy="13" r="7"></circle>
<circle cx="6.5" cy="7.5" r="2.5"></circle>
<circle cx="17.5" cy="7.5" r="2.5"></circle>
<circle cx="9.5" cy="12" fill="currentColor" r="0.8"></circle>
<circle cx="14.5" cy="12" fill="currentColor" r="0.8"></circle>
<ellipse cx="12" cy="14.5" rx="1.6" ry="1"></ellipse>
</svg>
<h1 class="text-2xl font-bold tracking-tight text-charcoal-title">画库</h1>
</div>
<p class="text-xs text-muted-sage font-medium tracking-normal pl-0.5">
          1 个角色 · 0 个文件夹 · 0 张图片
        </p>
</section>
<!-- END: GalleryHeaderSection -->
<!-- BEGIN: SearchBar -->
<section data-purpose="search-box">
<div class="relative flex items-center bg-white/95 rounded-2xl border border-[#DFE7DD] px-4 py-3.5 shadow-sm shadow-[#DFE7DD]/30">
<!-- Search Magnifier Icon -->
<svg class="w-4 h-4 text-[#8D998F] mr-3 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7"></circle>
<path d="M21 21l-4.35-4.35" stroke-linecap="round"></path>
</svg>
<input class="w-full bg-transparent border-none p-0 text-sm text-charcoal-title placeholder-[#9DAAA0] focus:ring-0 focus:outline-none" placeholder="搜索角色名、特征、故事..." type="text">
</div>
</section>
<!-- END: SearchBar -->
<!-- BEGIN: BreadcrumbTag -->
<section class="pt-1">
<button class="inline-flex items-center space-x-1.5 px-3 py-1.5 bg-[#4F725F] text-white text-xs font-medium rounded-full shadow-xs">
<!-- Home / Small Folder Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
<path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
</svg>
<span class="">画库</span>
</button>
</section>
<!-- END: BreadcrumbTag -->
<!-- BEGIN: ActionButtonsBar -->
<section class="grid grid-cols-3 gap-2.5 pt-1" data-purpose="quick-actions">
<!-- New Button (Primary Green Filled) -->
<button class="flex items-center justify-center space-x-1.5 py-3 px-3 bg-[#4F725F] hover:bg-sage-hover text-white rounded-xl shadow-xs transition-colors active:scale-98">
<!-- Plus in Circle -->
<svg class="w-4 h-4 text-[#D8E6DC] fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" fill-rule="evenodd"></path>
</svg>
<span class="text-sm font-bold">新建</span>
</button>
<!-- Camera Button (Dashed Green Border) -->
<button class="flex items-center justify-center space-x-1.5 py-3 px-2 bg-white/70 hover:bg-white border-2 border-dashed border-[#7AA189] text-[#4F725F] rounded-xl transition-colors active:scale-98">
<!-- Camera Outline Icon -->
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-sm font-bold">拍照</span>
</button>
<!-- Import Image Button (Dashed Green Border) -->
<button class="flex items-center justify-center space-x-1.5 py-3 px-2 bg-white/70 hover:bg-white border-2 border-dashed border-[#7AA189] text-[#4F725F] rounded-xl transition-colors active:scale-98">
<!-- Image Gallery Outline Icon -->
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<polyline points="21 15 16 10 5 21"></polyline>
</svg>
<span class="text-sm font-bold">导入图片</span>
</button>
</section>
<!-- END: ActionButtonsBar -->
<!-- BEGIN: CharactersSection -->
<section class="pt-4 space-y-3" data-purpose="character-list">
<!-- Section Title with Bear Icon and Horizontal Line -->
<div class="flex items-center space-x-2">
<div class="flex items-center space-x-1.5 text-xs text-charcoal-title font-bold">
<!-- Mini Bear mascot -->
<svg class="w-4 h-4 text-muted-sage fill-none stroke-current stroke-[2]" viewBox="0 0 24 24">
<circle cx="12" cy="13" r="6"></circle>
<circle cx="7" cy="8" r="2"></circle>
<circle cx="17" cy="8" r="2"></circle>
</svg>
<span class="">角色</span>
</div>
<!-- Delicate hairline divider -->
<div class="flex-1 h-[1px] bg-[#E3E8DF]"></div>
</div>
<!-- Character Grid / Card Container -->
<div class="grid grid-cols-2 gap-3.5">
<!-- Character Card -->
<article class="bg-white rounded-2xl p-2.5 shadow-sm border border-[#E9EFE6] flex flex-col justify-between" data-purpose="character-card">
<!-- Inner Artwork Preview Sheet (Mimicking the stationery journal spread) -->
<div class="bg-[#F8FAF7] rounded-xl p-2 border border-[#E3ECE1]">
<!-- Mini Header in Art Card -->
<div class="flex items-center justify-between text-[9px] text-[#55695C] font-semibold mb-1.5">
<div class="flex items-center space-x-1">
<span class="text-[8px] bg-[#DFECE2] text-[#42604F] px-1 rounded font-bold">01</span>
<span class="">小令艮</span>
</div>
<span class="font-bold text-[#4B6F5A]">¥5</span>
</div>
<div class="text-[8px] text-gray-400 -mt-1 mb-1 font-mono">11111</div>
<!-- Two Split Preview Artworks Container -->
<div class="grid grid-cols-2 gap-1.5 bg-white p-1 rounded-lg border border-[#E8EDE4]">
<!-- Artwork 1 -->
<div class="aspect-[3/4] rounded overflow-hidden bg-[#FBF8EF] flex items-center justify-center relative">
<div class="w-full h-full flex flex-col items-center justify-center p-1 text-center">
<!-- Anime girl sketch placeholder style -->
<div class="w-7 h-7 rounded-full bg-[#FFEED4] border border-[#EED7B8] mb-1 flex items-center justify-center text-[10px]">👱‍♀️</div>
<span class="text-[7px] text-[#A69B88] font-mono leading-none">Artwork</span>
</div>
</div>
<!-- Artwork 2 -->
<div class="aspect-[3/4] rounded overflow-hidden bg-[#F8F9F3] flex items-center justify-center relative">
<div class="w-full h-full flex flex-col items-center justify-center p-1 text-center">
<!-- Anime companion sketch placeholder style -->
<div class="w-7 h-7 rounded-full bg-[#E5F0E6] border border-[#CDE0CF] mb-1 flex items-center justify-center text-[10px]">🧝‍♀️</div>
<span class="text-[7px] text-[#869E8A] font-mono leading-none">Sample</span>
</div>
</div>
</div>
<!-- Mini Footing in artwork frame -->
<div class="flex items-center space-x-1 mt-1.5 text-[8px] font-semibold text-[#8C9B8E]">
<span class="text-[#4E7660]">02</span>
<span class="">2</span>
</div>
</div>
<!-- Card Bottom Meta Details -->
<div class="pt-2 px-1">
<h2 class="text-sm font-bold text-charcoal-title leading-tight">&gt;_&lt;</h2>
<p class="text-[11px] text-muted-sage mt-0.5 font-medium">5 条约约 · ¥9</p>
</div>
</article>
</div>
</section>
<!-- END: CharactersSection -->
</main>
</div>
<!-- END: MainContainer -->

    <a class="flex flex-col items-center justify-center py-1.5 text-[#8D968F] hover:text-[#3C6A58] transition-colors rounded-xl" href="#">
      <svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>

      <svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect height="16" rx="2" width="16" x="4" y="4"></rect>
        <path d="M9 4v3a1 1 0 001 1h4a1 1 0 001-1V4"></path>
        <path d="M8 12h8M8 16h5"></path>
      </svg>
      <span class="text-[11px] font-medium mt-1">稿单</span>
    </a>
    <!-- 3. 画库 (高亮选中态) -->
    <a class="flex flex-col items-center justify-center py-1" href="#">
      <div class="w-16 py-1.5 bg-[#DFECE2] rounded-full flex flex-col items-center justify-center">
        <svg class="w-5 h-5 text-[#3C6A58] fill-none stroke-current stroke-[2]" viewBox="0 0 24 24">
          <circle cx="12" cy="13" r="7"></circle>
          <circle cx="6.5" cy="7.5" r="2.5"></circle>
          <circle cx="17.5" cy="7.5" r="2.5"></circle>
          <circle cx="9.5" cy="12" fill="currentColor" r="0.8"></circle>
          <circle cx="14.5" cy="12" fill="currentColor" r="0.8"></circle>
          <ellipse cx="12" cy="14.5" rx="1.6" ry="1"></ellipse>
        </svg>
        <span class="text-[11px] font-bold text-[#3C6A58] mt-0.5">画库</span>
      </div>
    </a>
    <!-- 4. 我的 -->
    <a class="flex flex-col items-center justify-center py-1.5 text-[#8D968F] hover:text-[#3C6A58] transition-colors rounded-xl" href="#">
      <svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="text-[11px] font-medium mt-1">我的</span>
    </a>
  </div>
  <!-- iOS Home Indicator bar -->
  <div class="w-32 h-1 bg-gray-600 rounded-full mx-auto mt-2"></div>
</nav>
