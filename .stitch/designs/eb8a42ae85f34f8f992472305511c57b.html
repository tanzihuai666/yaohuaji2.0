<path d="M2.5 8 C4.5 7.5 15.5 7.5 17.5 8" stroke="#dfb664" stroke-width="1.2"></path>

<input autofocus="" class="w-full h-11 bg-white border border-[#d6cfbe] rounded-xl px-3.5 text-[14px] text-text-main placeholder-[#a1aaa2] focus:bg-white focus:border-[#89a997] transition-all shadow-sm" id="modal-group-input" placeholder="请输入分组名称（如：商稿、主设、头像...）" type="text">
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center gap-2.5 pt-1">
<button class="flex-1 h-10 rounded-xl bg-[#edf1ec] border border-[#d8e2da] text-[#556b5e] font-medium text-[14px] active:bg-[#e4ece6] transition-colors" id="btn-cancel-group" type="button">
        取消
      </button>
<button class="flex-1 h-10 rounded-xl bg-[#3c6a58] hover:bg-[#235241] active:scale-[0.98] text-white font-medium text-[14px] shadow-sm transition-all" id="btn-confirm-group" type="button">
        确认
      </button>
</div>
</div>
</div>
<script>
  (function() {
    const modal = document.getElementById('group-modal');
    const groupBtn = document.getElementById('group-select');
    const cancelBtn = document.getElementById('btn-cancel-group');
    const confirmBtn = document.getElementById('btn-confirm-group');
    const backdrop = document.getElementById('modal-backdrop-dismiss');
    const groupInput = document.getElementById('modal-group-input');
    const groupDisplay = document.getElementById('group-name-display');

    function openModal() {
      if (!modal) return;
      modal.classList.remove('hidden');
      if (groupInput) {
        groupInput.value = '';
        setTimeout(() => groupInput.focus(), 50);
      }
    }

    function closeModal() {
      if (!modal) return;
      modal.classList.add('hidden');
    }

    if (groupBtn) {
      groupBtn.addEventListener('click', openModal);
    }
    if (cancelBtn) {
      cancelBtn.addEventListener('click', closeModal);
    }
    if (backdrop) {
      backdrop.addEventListener('click', closeModal);
    }
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        if (groupInput && groupDisplay && groupInput.value.trim() !== '') {
          groupDisplay.textContent = groupInput.value.trim();
        }
        closeModal();
      });
    }
    if (groupInput) {
      groupInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (confirmBtn) confirmBtn.click();
        }
      });
    }
  })();
</script>
