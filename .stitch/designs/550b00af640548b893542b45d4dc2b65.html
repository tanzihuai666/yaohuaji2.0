ton><h1 class="font-headline-md text-headline-md text-primary tracking-tight text-center truncate flex-1 px-space-sm">新建文件夹</h1><div class="flex items-center justify-end gap-space-xs"><button class="min-h-[44px] px-space-md py-space-xs rounded-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg shadow-[0_4px_12px_rgba(60,106,88,0.18)] active:scale-95 transition-all flex items-center gap-space-xs" type="button"><span class="material-symbols-outlined text-[18px]">check</span><span class="">保存</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-space-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-transparent min-h-screen"><div class="flex flex-col w-full pb-10 space-y-space-lg px-margin">

<label class="font-label-lg text-label-lg text-on-surface" for="folderNameInput">文件夹名称</label>

<div class="relative flex items-center">
<input class="w-full h-11 px-space-md pr-9 rounded-xl bg-surface-container-low text-on-surface font-body-lg text-body-lg placeholder:text-outline/70 focus:outline-none focus:bg-surface-container transition-all" id="folderNameInput" maxlength="20" placeholder="例如：主设企划、商稿归档、OC世界观..." type="text">
<button class="absolute right-2.5 w-6 h-6 rounded-full text-outline hover:text-on-surface flex items-center justify-center hidden" id="clearNameBtn" type="button">

</div>
<div class="relative w-full rounded-xl bg-surface-container-low p-space-sm focus-within:bg-surface-container transition-all">

</div>

<div class="flex flex-wrap gap-space-xs" id="categoryChips">
<button class="category-chip px-space-md py-1.5 rounded-full font-label-lg text-label-lg bg-primary text-on-primary transition-all shadow-sm" type="button">全部设子</button>
<button class="category-chip px-space-md py-1.5 rounded-full font-label-lg text-label-lg bg-surface-container-low text-on-surface-variant hover:bg-surface-container transition-all" type="button">未分类角色</button>
<button class="category-chip px-space-md py-1.5 rounded-full font-label-lg text-label-lg bg-surface-container-low text-on-surface-variant hover:bg-surface-container transition-all" type="button">专属企划</button>
<button class="category-chip px-space-md py-1.5 rounded-full font-label-lg text-label-lg bg-surface-container-low text-on-surface-variant hover:bg-surface-container transition-all" type="button">商稿委托</button>

</div>

<span class="pointer-events-none inline-block h-5 w-5 transform translate-x-1 translate-y-1 rounded-full bg-surface-container-lowest shadow-sm ring-0 transition duration-200 ease-in-out" id="togglePrivateKnob"></span>
</button>

<span class="font-label-md text-label-md text-outline">常驻画库顶部方便快捷查阅</span>
</div>
<button aria-checked="true" class="relative inline-flex h-7 w-12 flex-shrink-0 cursor-pointer rounded-full bg-primary transition-colors duration-200 ease-in-out focus:outline-none" id="togglePinned" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform translate-x-6 translate-y-1 rounded-full bg-surface-container-lowest shadow-sm ring-0 transition duration-200 ease-in-out" id="togglePinnedKnob"></span>
</button>

<span class="material-symbols-outlined text-[18px]">sort</span>
<span id="sortLabel" class="">按最新添加</span>
<span class="material-symbols-outlined text-[16px] text-outline">arrow_drop_down</span>
</div>

      取消
    </button>
<button class="flex-[2] h-12 rounded-full bg-primary text-on-primary font-headline-md text-headline-md shadow-[0_6px_16px_rgba(60,106,88,0.22)] hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-space-xs" id="createFolderBtn" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span class="">立即创建文件夹</span>
</button>

<script>
  (() => {
    const nameInput = document.getElementById('folderNameInput');
    const nameCounter = document.getElementById('nameCounter');
    const clearBtn = document.getElementById('clearNameBtn');

    nameInput.addEventListener('input', (e) => {
      const len = e.target.value.length;
      nameCounter.textContent = `${len}/20`;
      clearBtn.classList.toggle('hidden', len === 0);
    });

    clearBtn.addEventListener('click', () => {
      nameInput.value = '';
      nameCounter.textContent = '0/20';
      clearBtn.classList.add('hidden');
      nameInput.focus();
    });

    const dots = document.querySelectorAll('.color-dot');
    const colorLabel = document.getElementById('selectedColorLabel');
    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        dots.forEach((d) => {
          d.classList.remove('ring-2', 'ring-primary', 'ring-offset-2');
          const check = d.querySelector('.material-symbols-outlined');
          if (check) check.classList.add('hidden');
        });
        dot.classList.add('ring-2', 'ring-primary', 'ring-offset-2');
        const activeCheck = dot.querySelector('.material-symbols-outlined');
        if (activeCheck) activeCheck.classList.remove('hidden');
        colorLabel.textContent = dot.dataset.colorName || '自定义';
      });
    });

    const categoryChips = document.querySelectorAll('.category-chip');
    categoryChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        categoryChips.forEach((c) => {
          c.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          c.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        });
        chip.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        chip.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
      });
    });

    const setupSwitch = (btnId, knobId, initialState) => {
      const btn = document.getElementById(btnId);
      const knob = document.getElementById(knobId);
      let state = initialState;

      const update = () => {
        btn.setAttribute('aria-checked', state ? 'true' : 'false');
        if (state) {
          btn.classList.remove('bg-surface-container-highest');
          btn.classList.add('bg-primary');
          knob.classList.remove('translate-x-1');
          knob.classList.add('translate-x-6');
        } else {
          btn.classList.remove('bg-primary');
          btn.classList.add('bg-surface-container-highest');
          knob.classList.remove('translate-x-6');
          knob.classList.add('translate-x-1');
        }
      };

      btn.addEventListener('click', () => {
        state = !state;
        update();
      });
      update();
    };

    setupSwitch('togglePrivate', 'togglePrivateKnob', false);
    setupSwitch('togglePinned', 'togglePinnedKnob', true);

    const sortOptions = ['按最新添加', '按稿件更新', '按名称排序', '按设子编号'];
    let sortIdx = 0;
    const sortLabel = document.getElementById('sortLabel');
    sortLabel.parentElement.addEventListener('click', () => {
      sortIdx = (sortIdx + 1) % sortOptions.length;
      sortLabel.textContent = sortOptions[sortIdx];
    });

    const createBtn = document.getElementById('createFolderBtn');
    createBtn.addEventListener('click', () => {
      const name = nameInput.value.trim() || '未命名文件夹';
      createBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>正在封存...</span>`;
      setTimeout(() => {
        alert(`手账文件夹「${name}」已创建完成！`);
        history.back();
      }, 500);
    });
  })();
</script></main>
